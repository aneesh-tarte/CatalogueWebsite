<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Dashboard</title>
    <meta name="description" content="Your personal catalog for tracking media items securely.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Catalogue</h1>
        </div>
        <div class="search-container">
            <input type="text" id="global-search" placeholder="Search catalog..." autocomplete="off" />
            <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="user-profile">
            <button class="btn btn-primary" id="auth-btn">Sign In</button>
        </div>
    </header>

    <main class="dashboard-layout">
        <section class="news-hero">
            <div class="news-carousel" id="news-carousel">
                <div class="loader">Fetching latest news...</div>
            </div>
        </section>

        <section class="chat-section">
            <header class="section-header">
                <h2>Live Community Chat</h2>
            </header>
            <div class="chat-container">
                <div class="chat-history" id="chat-history"></div>
                <form id="chat-form" class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message..." required autocomplete="off" />
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </section>

        <section class="library-section">
            <header class="section-header">
                <h2>Your Tracking Library</h2>
            </header>
            
            <nav class="library-tabs">
                <button class="tab-btn active" data-status="In Progress">In Progress</button>
                <button class="tab-btn" data-status="Plan to Track">Plan to Track</button>
                <button class="tab-btn" data-status="Completed">Completed</button>
                <button class="tab-btn" data-status="Dropped">Dropped</button>
            </nav>

            <div class="library-content" id="library-content">
                <div class="loader">Loading library...</div>
            </div>
        </section>

    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="close-auth-modal">&times;</span>
            <h2 id="auth-modal-title">Sign In</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" required placeholder="Enter your password">
                </div>
                <div id="auth-error" class="error-msg hidden"></div>
                <button type="submit" class="btn btn-primary full-width" id="auth-submit-btn">Sign In</button>
            </form>
            <p class="auth-switch"><span id="auth-switch-text">Need an account?</span> <a href="#" id="auth-switch-link">Register</a></p>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="modal hidden">
        <div class="modal-content details-modal-content">
            <span class="close-modal" id="close-details-modal">&times;</span>
            <div class="details-layout">
                <img id="details-image" src="" alt="Cover Image" class="details-image" />
                <div class="details-info">
                    <h2 id="details-title">Title</h2>
                    <p class="details-meta"><span id="details-type">TYPE</span> • <span id="details-release">YYYY</span></p>
                    <p id="details-synopsis" class="details-synopsis">Synopsis...</p>
                    <div class="details-actions">
                        <button id="details-add-btn" class="btn btn-primary full-width">Add to Library</button>
                        <button id="details-news-btn" class="btn btn-secondary full-width">Check News</button>
                    </div>
                </div>
            </div>
            <div class="details-reviews-section">
                <header class="section-header">
                    <h2>Global Rating: <span id="details-rating" style="color: var(--accent-vibrant);">N/A</span></h2>
                </header>
                <div id="details-reviews-list" class="reviews-list">
                    <!-- Reviews will be injected here -->
                </div>
            </div>
            <div class="details-comments-section">
                <header class="section-header">
                    <h2>Community Comments</h2>
                </header>
                <div class="comment-form-container">
                    <textarea id="new-comment-input" placeholder="Join the discussion..."></textarea>
                    <button id="submit-comment-btn" class="btn btn-primary">Post Comment</button>
                </div>
                <div id="details-comments-list" class="comments-list">
                    <!-- Comments injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
